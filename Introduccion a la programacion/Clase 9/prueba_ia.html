<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header - Nike</title>
  
  <!-- Carga de Iconos de Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Archivo de Estilos Principal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado principal de la página -->
  <header class="main-header">

    <!-- 2. Menú de Navegación Principal -->
    <nav class="main-nav">
      <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#zapatos">Zapatos</a></li>
        <li><a href="#galeria">Galería</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>

    <!-- 3. Iconos de Acción (Búsqueda, Favoritos, Carrito) -->
    <div class="header-actions">
      <button class="icon-btn" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn" aria-label="Favoritos"><i class="fa-regular fa-heart"></i></button>
      <button class="icon-btn" aria-label="Carrito"><i class="fa-solid fa-bag-shopping"></i></button>
    </div>

  </header>

</body>
</html>
